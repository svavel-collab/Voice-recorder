<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Spara Ikon</title>
  <style>
    body { background: #09090b; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; gap: 20px; }
    canvas { border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 256px; height: 256px; }
    button { background: #f97316; color: white; border: none; padding: 14px 28px; font-size: 1.1rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4); }
  </style>
</head>
<body>

  <canvas id="c" width="512" height="512"></canvas>
  <button onclick="downloadIcon()">Spara icon.png</button>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // Bakgrund (Squircle)
    const r = 110, x = 0, y = 0, w = 512, h = 512;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.clip();

    const bgGrad = ctx.createLinearGradient(0, 0, 0, 512);
    bgGrad.addColorStop(0, '#1a1d24');
    bgGrad.addColorStop(0.5, '#0d0f12');
    bgGrad.addColorStop(1, '#050608');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 6;
    ctx.stroke();

    // Orange Ljudvågor
    const waveHeights = [25, 45, 80, 140, 90, 180, 230, 120, 190, 240, 160, 100, 170, 110, 60, 30];
    const barWidth = 12, gap = 12;
    const totalWidth = (waveHeights.length * barWidth) + ((waveHeights.length - 1) * gap);
    const startX = (512 - totalWidth) / 2;
    const centerY = 256;

    const orangeGrad = ctx.createLinearGradient(0, 100, 0, 400);
    orangeGrad.addColorStop(0, '#ff8c00');
    orangeGrad.addColorStop(0.5, '#f97316');
    orangeGrad.addColorStop(1, '#ea580c');

    ctx.shadowColor = 'rgba(249, 115, 22, 0.6)';
    ctx.shadowBlur = 20;

    waveHeights.forEach((height, i) => {
      const barX = startX + i * (barWidth + gap);
      const barY = centerY - height / 2;
      ctx.fillStyle = orangeGrad;
      ctx.beginPath();
      ctx.roundRect(barX, barY, barWidth, height, 6);
      ctx.fill();
    });

    // Gul Markör
    const markerIndex = 9;
    const markerX = startX + markerIndex * (barWidth + gap) + barWidth / 2;
    const markerHeight = 270;

    ctx.shadowColor = 'rgba(253, 224, 71, 0.8)';
    ctx.shadowBlur = 15;
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(markerX, centerY - markerHeight / 2);
    ctx.lineTo(markerX, centerY + markerHeight / 2);
    ctx.stroke();

    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(markerX, centerY - markerHeight / 2, 8, 0, Math.PI * 2);
    ctx.arc(markerX, centerY + markerHeight / 2, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Glanseffekt
    const glossGrad = ctx.createLinearGradient(0, 0, 0, 256);
    glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
    glossGrad.addColorStop(0.7, 'rgba(255, 255, 255, 0.05)');
    glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = glossGrad;
    ctx.beginPath();
    ctx.ellipse(256, 0, 360, 220, 0, 0, Math.PI);
    ctx.fill();
    ctx.restore();

    function downloadIcon() {
      const a = document.createElement('a');
      a.download = 'icon.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
